# Mises à jour automatiques des dépendances : Dependabot ouvre une pull request par semaine et
# par écosystème quand une nouvelle version (ou un correctif de sécurité) est disponible.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Vite et son plugin React évoluent ensemble (chaque version majeure du plugin exige la version
      # de Vite correspondante) : une seule pull request pour les deux, sinon chacune échoue seule.
      vite:
        patterns: ["vite", "@vitejs/*"]
      # Même logique pour ESLint et sa configuration recommandée (@eslint/js).
      eslint:
        patterns: ["eslint", "@eslint/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
